services:
  backend:
    build: ./server
    container_name: makeeleven-backend
    environment:
      - PORT=3001
      - DB_PATH=/app/data/makeeleven.sqlite
    volumes:
      - makeeleven-data:/app/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  makeeleven:
    build: .
    container_name: makeeleven
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  makeeleven-data:
